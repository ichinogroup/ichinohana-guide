<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homestay Guide</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Welcome Page -->
  <div id="welcomePage" class="page active">
    <div class="welcome-screen">
      <div class="welcome">
        <img src="logo.svg" alt="Ichinohana Logo" class="logo">

        <h1>お宿一の華</h1>
        <p>飛騨高山</p>

        <div class="lang-buttons">
          <button onclick="showGuide('en')">English</button>
          <button onclick="showGuide('jp')">日本語</button>
          <button onclick="showGuide('cn')">中文</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Guide Page -->
  <div id="guidePage" class="page">
    <div class="main-content">
      <button class="back-btn" onclick="goBack()">← Back</button>

      <div class="guide-header">
        <h2 id="guideTitle">House Manual</h2>
        <p id="guideSubtitle">Find the information you need</p>
      </div>

      <div class="menu" id="menuContainer"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
